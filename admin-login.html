<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Government ITI Darbhanga</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #edf3fb;
      font-family: Arial, sans-serif;
    }
    .login-box {
      background: white;
      width: min(320px, 82vw);
      padding: 28px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #0002;
    }
    h2 { color: #12305b; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 9px 0;
      border-radius: 7px;
      border: 1px solid #ccc;
    }
    button {
      background: #12305b;
      color: white;
      cursor: pointer;
    }
    #message { color: #c62828; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <p>Government ITI Darbhanga</p>

    <form id="loginForm">
      <input
        type="password"
        id="password"
        placeholder="Admin Password"
        required
      >
      <button type="submit">Sign In</button>
      <p id="message"></p>
    </form>
  </div>

  <script>
    const ADMIN_PASSWORD = "@manasadmin@271207";

    document.getElementById("loginForm").addEventListener(
      "submit", function(event) {
        event.preventDefault();

        if (document.getElementById("password").value
            === ADMIN_PASSWORD) {
          sessionStorage.setItem("adminDemoLogin", "true");
          window.location.href = "admin.html";
        } else {
          document.getElementById("message").textContent =
            "Incorrect password!";
        }
      }
    );
  </script>
</body>
</html>
